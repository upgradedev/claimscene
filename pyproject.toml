[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimscene"
version = "0.1.0"
description = "Honest accident documentation & illustration — VLM-constrained scene graphs, deterministic top-down schematics, sealed provenance on Backblaze B2 + Genblaze."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "upgradedev" }]
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.2",
]

[project.optional-dependencies]
# Real backends (add credentials to use). boto3 backs the Backblaze B2
# storage adapter; genblaze[gmicloud] backs the illustration provider
# (GMI Cloud + B2 ObjectStorageSink); openai backs the OpenAI-compatible
# VLM ladder client (GMI serving + Nebius inference).
live = [
    "boto3>=1.34",
    "genblaze[gmicloud]>=0.4,<0.5",
    "openai>=1.30",
]
# Future HTTP API / demo server seam.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
claimscene = "claimscene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." keeps `tests.conftest` importable under bare `pytest tests/e2e` too
# (CI invokes per-tier paths; without cwd on sys.path the package import fails).
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ffmpeg: tests that need a real ffmpeg binary on PATH (skipped otherwise)",
    "live: tests that call paid live endpoints (skipped without GMI_API_KEY; excluded from CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

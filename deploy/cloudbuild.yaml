# Cloud Build — build the ClaimScene container and push it to Artifact Registry.
# Cloud-first: the image is built by Cloud Build (no local Docker required).
#
# Invoked by deploy/deploy-cloudrun.sh, or directly:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_IMAGE=europe-west1-docker.pkg.dev/PROJECT/REPO/claimscene:TAG
substitutions:
  _IMAGE: "europe-west1-docker.pkg.dev/upgradegr-claimscene/claimscene/claimscene:latest"
  # Stamped into the image so GET /health reports the commit actually running.
  # deploy/deploy-cloudrun.sh fills these from git; empty is reported as null.
  _BUILD_SHA: ""
  _BUILD_TIME: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - "build"
      - "-t"
      - "${_IMAGE}"
      - "--build-arg"
      - "CLAIMSCENE_BUILD_SHA=${_BUILD_SHA}"
      - "--build-arg"
      - "CLAIMSCENE_BUILD_TIME=${_BUILD_TIME}"
      - "-f"
      - "Dockerfile"
      - "."

images:
  - "${_IMAGE}"

options:
  # Required when the build has no default logs bucket (default Cloud Build SA).
  logging: CLOUD_LOGGING_ONLY

name: Deploy to Cloud Run

# Deploys only after CI has already gone green on `main`, so a red build cannot
# reach the live app. `workflow_run` fires on CI's completion whatever the
# result, so the job re-checks the conclusion itself.
#
# Auth is Workload Identity Federation. GitHub proves its identity to Google
# per run over OIDC and **no service-account key is stored in this repository**.
# The Google-side provider carries the condition
# `assertion.repository=='upgradedev/claimscene'`, so the restriction is
# enforced by Google, not by anything in this file. That distinction matters
# because this repository is public: a copy of this workflow running anywhere
# else is rejected at the token exchange, not by a check someone could edit.
#
# The deploy identity holds six roles and none of them is an admin over IAM,
# secrets or service enablement. One-time provisioning (enabling APIs, creating
# the Artifact Registry repo, granting the runtime account access to each
# secret) is skipped here through DEPLOY_SKIP_PROVISIONING and is done once by
# an owner running the same script locally.
#
# Neither value below is a credential. They are resource identifiers, useless
# without an OIDC token from this exact repository, and they are inline rather
# than hidden in settings so the whole trust path is readable from the repo.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write        # the OIDC token; nothing else is granted

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false   # never interrupt a deploy mid-rollout

env:
  APP_URL: https://claimscene-147595510158.europe-west1.run.app
  # Non-secret runtime config. The secret values live in Secret Manager and are
  # referenced by name; they never pass through this workflow.
  CLAIMSCENE_MODE: live
  B2_BUCKET_NAME: claimscene
  B2_S3_ENDPOINT: https://s3.eu-central-003.backblazeb2.com

jobs:
  deploy:
    # workflow_run fires on failure too; a manual dispatch has no upstream run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI validated, not whatever `main` points at now,
          # so the build stamp names code that actually passed its tests.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/147595510158/locations/global/workloadIdentityPools/github/providers/upgradedev
          service_account: github-deployer@upgradegr-claimscene.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        env:
          DEPLOY_SKIP_PROVISIONING: "1"
        run: bash deploy/deploy-cloudrun.sh

      - name: Confirm the live app is the commit that was just built
        # A deploy is not finished because gcloud exited 0. It is finished when
        # the running service says so, which is the same check a judge can make.
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in $(seq 1 20); do
            live="$(curl -fsS "${APP_URL}/health" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["build"]["commit"])')"
            if [ "${live}" = "${expected}" ]; then
              echo "live build.commit == ${expected}"
              exit 0
            fi
            echo "attempt ${attempt}: live=${live} expected=${expected}"
            sleep 6
          done
          echo "the live app never reported the deployed commit" >&2
          exit 1

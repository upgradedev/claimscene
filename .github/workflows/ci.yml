name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. Secret scan (fail-fast, before anything is built) ────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (v8.18.4)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  # ── 2. Lint → tests (fully OFFLINE: fakes only, zero creds) → dep audit ─────
  python:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Integration tests
        run: pytest tests/integration -v
      - name: E2E tests
        run: pytest tests/e2e -v
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

  # ── 3. Readiness gate skeleton (NON-GATING for the foundation phase) ────────
  #  Real-evidence checks driving the pipeline/CLI/B2 adapter. Runs with
  #  --min 0 for now (prints + archives the score); the threshold is hardened
  #  in a later phase once the live adapters land.
  readiness:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Readiness gate (non-gating, --min 0)
        run: python scripts/readiness.py --min 0
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: readiness.json

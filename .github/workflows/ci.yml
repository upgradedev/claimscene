name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. Secret scan (fail-fast, before anything is built) ────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (v8.18.4)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  # ── 2. Lint → tests (fully OFFLINE: fakes only, zero creds) → dep audit ─────
  python:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[server]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      # One combined run over ALL tiers (unit + integration + e2e + security +
      # load) so the coverage number is measured across the whole suite — no
      # single tier reaches the gate alone. Live-marked smoke tests self-skip
      # without GMI_API_KEY (CI is credential-free). Backend measures ~96%.
      - name: Tests + coverage gate (combined, >= 90%)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=90 tests/
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

  # ── 3. Readiness gate (GATING since Phase 2: live adapters + evidence) ──────
  #  Real-evidence checks driving the pipeline/CLI/B2 adapter, the VLM
  #  repair loop (canned transport), the real Genblaze Pipeline contract,
  #  the committed eval scoreboard floor, and the committed live-illustration
  #  evidence hashes. Fails the build under 95% automatable completeness.
  readiness:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[server]"
      - name: Readiness gate (--min 95)
        run: python scripts/readiness.py --min 95
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: readiness.json

  # ── 4. Pen-test: application-security suite + SCA/CVE gate ───────────────────
  #  Real app-security assertions driving the FastAPI app / pipeline / adapters
  #  (tests/security): authZ + abuse/DoS bounds, injection / path-traversal,
  #  upload magic-byte validation, provenance-tamper integrity, sensitive-data
  #  exposure, and SSRF posture. Plus the software-composition (SCA) gate:
  #  pip-audit (python runtime deps) + npm audit (frontend shipped deps). Fully
  #  offline — no credentials, no network.
  pen-test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[server]"
      - name: Pen-test suite (tests/security)
        run: pytest tests/security -v
      - name: SCA/CVE gate — pip-audit (runtime deps)
        run: pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SCA/CVE gate — npm audit (frontend, shipped deps)
        working-directory: frontend
        # Gate the shipped dependency tree. --omit=dev excludes the Vite/Vitest
        # build+test toolchain (dev-server-only advisories that never reach the
        # deployed static bundle); the runtime deps must be clean at high+.
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  # ── 5. Web client (React/Vite): typecheck → unit tests → production build ────
  frontend:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + component tests + coverage gate (vitest)
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  # ── 6. CodeQL SAST (python + javascript/typescript) ─────────────────────────
  codeql:
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
